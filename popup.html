<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OneDrive / SharePoint PDF Downloader</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --accent-soft: #eef2ff;
    --ink: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --card: #ffffff;
    --bg: #ffffff;
    --bg-soft: #f7f7f8;
    --ok: #1a8754;
    --ok-soft: #e7f6ec;
    --warn: #c2410c;
    --warn-soft: #fff1e6;
    --ppt: #c43e1c;
    --ppt-ink: #a33a17;
    --ppt-soft: #fff6f2;
    --ppt-border: #f1c4b4;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.05);
    --ring: rgba(37,99,235,0.35);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #4f8cff;
      --accent-dark: #6ea0ff;
      --accent-soft: #1c2740;
      --ink: #e8eaed;
      --muted: #9aa1ad;
      --border: #2a2f37;
      --card: #1b1e24;
      --bg: #141619;
      --bg-soft: #1b1e24;
      --ok: #4ade80;
      --ok-soft: #14301f;
      --warn: #fb923c;
      --warn-soft: #33210f;
      --ppt: #e8623d;
      --ppt-ink: #f0a184;
      --ppt-soft: #2a1712;
      --ppt-border: #52281b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 2px 10px rgba(0,0,0,0.4);
      --ring: rgba(79,140,255,0.45);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, "Segoe UI", sans-serif;
    width: 380px;
    padding: 0;
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 14px 16px 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    color: #fff;
  }

  header img { width: 22px; height: 22px; flex-shrink: 0; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; line-height: 1.3; flex: 1; letter-spacing: 0.2px; }

  #langSelect {
    flex-shrink: 0;
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
  }
  #langSelect option { color: #1f2328; }

  .body-pad { padding: 12px 16px 16px; }

  details.help {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-soft);
    margin-bottom: 12px;
    padding: 0;
    overflow: hidden;
  }
  details.help summary {
    cursor: pointer;
    list-style: none;
    padding: 9px 11px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  details.help summary::-webkit-details-marker { display: none; }
  details.help summary::before { content: "💡"; }
  details.help[open] summary::after { content: "▲"; margin-left: auto; font-size: 9px; color: var(--muted); }
  details.help:not([open]) summary::after { content: "▼"; margin-left: auto; font-size: 9px; color: var(--muted); }

  .help ol {
    margin: 0;
    padding: 0 11px 11px 28px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .help li { margin-bottom: 2px; }
  .help b { color: var(--ink); }

  #refresh {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  #refresh:hover { background: var(--accent-dark); }
  #refresh:active { transform: scale(0.985); }

  .item {
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 11px 12px;
    margin-bottom: 10px;
    background: var(--card);
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .item:hover { box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }

  .item .row-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 7px;
  }
  .item .file-icon { font-size: 18px; line-height: 1.2; flex-shrink: 0; }
  .item .filename {
    font-size: 13px;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.4;
    color: var(--ink);
  }

  .badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.match { background: var(--accent-soft); color: var(--accent-dark); }
  .badge.large { background: var(--accent-soft); color: var(--accent-dark); }
  .badge.size { background: var(--bg-soft); color: var(--muted); }
  .badge.auth-ok { background: var(--ok-soft); color: var(--ok); }
  .badge.auth-bad { background: var(--warn-soft); color: var(--warn); }

  .item button {
    width: 100%;
    padding: 8px;
    cursor: pointer;
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .item button:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .item button:active:not(:disabled) { transform: scale(0.985); }
  .item button:disabled { opacity: 0.6; cursor: default; }
  .item:first-of-type button {
    background: var(--accent);
    color: #fff;
  }
  .item:first-of-type button:hover:not(:disabled) { background: var(--accent-dark); }

  #empty {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    padding: 30px 12px;
    line-height: 1.7;
  }
  #empty .empty-icon { font-size: 28px; display: block; margin-bottom: 8px; }

  footer {
    font-size: 10.5px;
    color: var(--muted);
    text-align: center;
    padding: 10px 12px 12px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  /* PowerPoint slide export */
  #slidesBox {
    border: 1px solid var(--ppt-border);
    background: var(--ppt-soft);
    border-left: 3px solid var(--ppt);
    border-radius: 10px;
    padding: 11px 12px;
    margin-bottom: 12px;
  }
  #slidesBox .slides-head {
    font-weight: 600;
    color: var(--ppt-ink);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
  }
  #slidesBox .slides-head::before { content: "📊"; }
  #slidesBox .slides-row { display: flex; gap: 6px; }
  #slidesBox button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--ppt);
    background: var(--ppt);
    color: #fff;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  #slidesBox button:hover:not(:disabled) { filter: brightness(0.94); }
  #slidesBox button:active:not(:disabled) { transform: scale(0.985); }
  #slidesBox button.secondary { flex: 0 0 auto; min-width: 72px; background: transparent; color: var(--ppt-ink); }
  #slidesBox button.secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--ppt) 12%, transparent); filter: none; }
  #slidesBox button:disabled { opacity: 0.55; cursor: default; }
  #slidesBox .slides-note { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.55; }
  #slidesBox .slides-quality { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
  #slidesBox .slides-quality label { color: var(--ppt-ink); font-weight: 600; }
  #slidesBox .slides-quality select {
    flex: 1;
    padding: 5px 6px;
    border: 1px solid var(--ppt-border);
    border-radius: 6px;
    font-size: 12px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="" />
    <h1 id="hdrTitle">OneDrive / SharePoint<br/>PDF Downloader</h1>
    <select id="langSelect" title="Language">
      <option value="en">EN</option>
      <option value="zh-Hant">中文</option>
    </select>
  </header>

  <div class="body-pad">
    <details class="help">
      <summary id="helpSummary">How to use</summary>
      <ol id="helpSteps"></ol>
    </details>

    <div id="slidesBox" style="display:none;">
      <div class="slides-head" id="slidesHead"></div>
      <div class="slides-quality">
        <label id="slidesQualityLabel" for="slidesQuality"></label>
        <select id="slidesQuality">
          <option value="standard"></option>
          <option value="high"></option>
          <option value="max"></option>
        </select>
      </div>
      <div class="slides-row">
        <button id="slidesPdf"></button>
        <button id="slidesText" class="secondary"></button>
      </div>
      <div class="slides-note" id="slidesNote"></div>
    </div>

    <button id="refresh"></button>
    <div id="list"></div>
    <div id="empty" style="display:none;">
      <span class="empty-icon">🔍</span>
      <span id="emptyText"></span>
    </div>
  </div>

  <footer id="footerText"></footer>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
